name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: yarn install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: yarn test
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@11
      - name: Stage the release on npm
        if: steps.version.outputs.publish == 'true'
        run: |
          set +e
          npm stage publish --provenance --access public > stage.log 2>&1
          status=$?
          cat stage.log
          if [ $status -ne 0 ] && grep -q "previously staged" stage.log; then
            echo "This version is already staged and waiting for approval on npmjs.com."
            exit 0
          fi
          exit $status
      - name: Draft the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "apart $VERSION" --generate-notes
          fi
          echo "apart-browser $VERSION is staged. Approve it on npmjs.com (Packages, apart-browser, Staged versions); the Release workflow publishes the GitHub release v$VERSION within 30 minutes of it going live." >> "$GITHUB_STEP_SUMMARY"

  chrome-web-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID || 'aejkpibmfgojapfgoplgnokmblmacgpe' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Check the Chrome Web Store is set up
        id: setup
        run: |
          if [ -z "$CWS_PUBLISHER_ID" ] || [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$GCP_SERVICE_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Chrome Web Store upload skipped: set the CWS_PUBLISHER_ID, GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT repository variables to turn it on." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - if: steps.setup.outputs.ready == 'true'
        run: yarn install --frozen-lockfile
      - if: steps.setup.outputs.ready == 'true'
        run: yarn test
      - name: Build the store package
        if: steps.setup.outputs.ready == 'true'
        id: package
        run: |
          yarn package:store
          echo "zip=dist/store/apart-extension-$(node -p "require('./package.json').version").zip" >> "$GITHUB_OUTPUT"
      - name: Sign in to Google
        if: steps.setup.outputs.ready == 'true'
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload and submit for review
        if: steps.setup.outputs.ready == 'true'
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_ZIP: ${{ steps.package.outputs.zip }}
        run: node scripts/chrome-web-store.mjs
