name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: yarn install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: yarn test
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@11
      - name: Stage the release on npm
        if: steps.version.outputs.publish == 'true'
        run: |
          set +e
          npm stage publish --provenance --access public > stage.log 2>&1
          status=$?
          cat stage.log
          if [ $status -ne 0 ] && grep -q "previously staged" stage.log; then
            echo "This version is already staged and waiting for approval on npmjs.com."
            exit 0
          fi
          exit $status
      - name: Draft the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          fi
          echo "apart-browser $VERSION is staged. Approve it on npmjs.com (Packages, apart-browser, Staged versions), then publish the draft GitHub release v$VERSION." >> "$GITHUB_STEP_SUMMARY"
